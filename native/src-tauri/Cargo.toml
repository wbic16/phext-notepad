[package]
name = "phext-notepad-native"
version = "0.5.0"
description = "Cross-platform Phext Notepad"
authors = ["Will Bickford <wbic16@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "phext_notepad_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
phext-notepad-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
