[package]
name = "phext-notepad-core"
version = "0.5.0"
description = "Phext document model and three-level zoom for Phext Notepad"
authors = ["Will Bickford <wbic16@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
libphext = "0.3.1"
# Sync talks to phext-edit over HTTPS and JSON — the same client
# stack phext-lattice itself uses (ureq + rustls, serde_json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
