<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phext Notepad</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="top">
    <nav id="menubar" aria-label="Main">
      <div class="menu">
        <button type="button" class="menu-root" aria-expanded="false" aria-controls="menu-file">File</button>
        <div id="menu-file" class="menu-pop" role="menu" hidden>
          <button type="button" data-action="new" role="menuitem">New<span class="hint">Ctrl+N</span></button>
          <button type="button" data-action="open" role="menuitem">Open…<span class="hint">Ctrl+O</span></button>
          <button type="button" data-action="baseline" role="menuitem">Open baseline</button>
          <div class="menu-label" id="recent-label">Recent</div>
          <div id="recent"></div>
          <div class="menu-rule"></div>
          <button type="button" data-action="save" role="menuitem">Save<span class="hint">Ctrl+S</span></button>
          <button type="button" data-action="save-as" role="menuitem">Save As…<span class="hint">Ctrl+Shift+S</span></button>
          <div class="menu-rule"></div>
          <button type="button" data-action="exit" role="menuitem">Exit</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-root" aria-expanded="false" aria-controls="menu-view">View</button>
        <div id="menu-view" class="menu-pop" role="menu" hidden>
          <button type="button" data-action="tree" role="menuitemcheckbox" aria-checked="true">Show tree</button>
          <button type="button" data-action="wrap" role="menuitemcheckbox" aria-checked="true">Word wrap</button>
          <div class="menu-rule"></div>
          <button type="button" data-action="theme" data-theme="system" role="menuitemradio">Theme: system</button>
          <button type="button" data-action="theme" data-theme="dark" role="menuitemradio">Theme: dark</button>
          <button type="button" data-action="theme" data-theme="light" role="menuitemradio">Theme: light</button>
          <div class="menu-rule"></div>
          <button type="button" data-action="zoom" data-level="outer" role="menuitemradio">Outer · 11D<span class="hint">Alt+1</span></button>
          <button type="button" data-action="zoom" data-level="middle" role="menuitemradio">Middle · 7D<span class="hint">Alt+2</span></button>
          <button type="button" data-action="zoom" data-level="inner" role="menuitemradio">Inner · 4D<span class="hint">Alt+3</span></button>
          <button type="button" data-action="zoom-out" role="menuitem">Zoom out<span class="hint">Alt+Up</span></button>
          <button type="button" data-action="zoom-in" role="menuitem">Zoom in<span class="hint">Alt+Down</span></button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-root" aria-expanded="false" aria-controls="menu-help">Help</button>
        <div id="menu-help" class="menu-pop" role="menu" hidden>
          <button type="button" data-action="about" role="menuitem">About Phext Notepad</button>
        </div>
      </div>
      <span id="doc-title">Phext Notepad</span>
    </nav>

    <form id="coord-form">
      <div id="arms"></div>
      <div id="zoom-switch" role="group" aria-label="Zoom">
        <button type="button" data-level="outer">11D</button>
        <button type="button" data-level="middle">7D</button>
        <button type="button" data-level="inner">4D</button>
      </div>
      <button type="button" id="zoom-out" title="Zoom out (Alt+Up)">−</button>
      <button type="button" id="zoom-in" title="Zoom in (Alt+Down)">+</button>
    </form>
    <div id="steppers"></div>
  </header>

  <div id="workspace">
    <aside id="tree-pane">
      <div id="tree-head">
        <div id="crumbs"></div>
        <h2 id="outline-title">4D · chapter.section.scroll</h2>
      </div>
      <div id="tree" role="tree"></div>
    </aside>
    <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize outline" tabindex="0"></div>
    <section id="editor-pane">
      <label class="sr" for="editor">Scroll text</label>
      <textarea id="editor" spellcheck="false" wrap="soft" aria-label="Scroll text"></textarea>
    </section>
  </div>

  <footer id="status">
    <span id="summary">Ready</span>
    <span id="caret">Line: 1, Column: 1</span>
    <span id="message"></span>
  </footer>

  <dialog id="confirm">
    <form method="dialog">
      <p id="confirm-text">Save changes to this phext?</p>
      <div class="confirm-actions">
        <button type="submit" value="save">Save</button>
        <button type="submit" value="discard">Don't save</button>
        <button type="submit" value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="about">
    <form method="dialog">
      <h2>Phext Notepad</h2>
      <p>A cross-platform editor for plain hypertext. Coordinates zoom in three arms: library.shelf.series, collection.volume.book, and chapter.section.scroll.</p>
      <p>Will Bickford · phext.io</p>
      <button type="submit" value="close">Close</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
