[package]
name = "phext-notepad"
version = "0.5.0"
description = "Cross-platform Phext Notepad"
authors = ["Will Bickford <wbic16@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "phext-notepad"
path = "src/main.rs"

[dependencies]
phext-notepad-core = { path = "../core" }
# FLTK is the window, tree, editor, and native file dialogs. The bundled
# feature compiles FLTK into the binary so Windows, macOS, and Linux do not
# need a system copy. No other features: no OpenGL, no image decoders.
fltk = { version = "1.5", default-features = false, features = ["fltk-bundled"] }
